<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#000000"/>
<title>kc_smart_lamp</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body data-power="on">
  <div class="app">
    <div class="layout">

      <!-- ───── Main panel ───── -->
      <main class="shell" aria-label="Lamp control">

        <!-- Connection pill -->
        <button id="conn-pill" class="conn-pill" data-state="connected" type="button" aria-live="polite">
          <span class="conn-dot" aria-hidden="true"></span>
          <span id="conn-label">Connected</span>
          <span class="conn-divider" aria-hidden="true">·</span>
          <span id="conn-detail" class="conn-detail">kc_smart_lamp</span>
        </button>

        <!-- Device header -->
        <header class="device-header">
          <div>
            <div class="device-eyebrow">Desk Lamp</div>
            <div class="device-name">kc_smart_lamp</div>
          </div>
          <div class="device-readout" aria-hidden="true">
            <div id="readout-hex">#FFB35A</div>
            <div id="readout-bri">60%</div>
          </div>
        </header>

        <!-- Color wheel hero -->
        <div class="wheel-wrap">
          <div id="wheel" class="wheel" role="slider"
               aria-label="Color picker"
               aria-valuemin="0" aria-valuemax="360" tabindex="0">
            <div class="wheel__hue" aria-hidden="true"></div>
            <div class="wheel__sat" aria-hidden="true"></div>
            <div class="wheel__rim" aria-hidden="true"></div>
            <div class="wheel__glow" aria-hidden="true"></div>
            <div id="wheel-thumb" class="wheel__thumb" aria-hidden="true"></div>
            <div class="wheel__core" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Brightness -->
        <section class="brightness" aria-label="Brightness">
          <div class="section-label">
            <span class="section-label__title">Brightness</span>
            <span id="brightness-value" class="section-label__value">60%</span>
          </div>
          <div id="brightness" class="slider" role="slider"
               aria-label="Brightness" aria-valuemin="0" aria-valuemax="100"
               aria-valuenow="60" tabindex="0">
            <div id="brightness-fill" class="slider__fill" style="width:60%"></div>
            <svg class="slider__icon slider__icon--lo" width="16" height="16" viewBox="0 0 16 16" fill="#fff" aria-hidden="true">
              <circle cx="8" cy="8" r="2"/>
            </svg>
            <svg class="slider__icon slider__icon--hi" width="18" height="18" viewBox="0 0 18 18" fill="#fff" aria-hidden="true">
              <circle cx="9" cy="9" r="3.5"/>
              <g stroke="#fff" stroke-width="1.4" stroke-linecap="round">
                <line x1="9" y1="1.5" x2="9" y2="3"/>
                <line x1="9" y1="15" x2="9" y2="16.5"/>
                <line x1="1.5" y1="9" x2="3" y2="9"/>
                <line x1="15" y1="9" x2="16.5" y2="9"/>
                <line x1="3.5" y1="3.5" x2="4.5" y2="4.5"/>
                <line x1="13.5" y1="13.5" x2="14.5" y2="14.5"/>
                <line x1="3.5" y1="14.5" x2="4.5" y2="13.5"/>
                <line x1="13.5" y1="4.5" x2="14.5" y2="3.5"/>
              </g>
            </svg>
            <div id="brightness-thumb" class="slider__thumb" style="left:60%"></div>
          </div>
        </section>

        <!-- Presets -->
        <section aria-label="Presets">
          <div class="section-label">
            <span class="section-label__title">Presets</span>
            <span class="section-label__hint">tap 即套用</span>
          </div>
          <div class="presets">
            <button class="chip" type="button" data-id="focus" data-kind="color">
              <span class="chip__glyph" aria-hidden="true"></span>
              <span class="chip__label">Focus</span>
              <span class="chip__sub">勿擾</span>
            </button>
            <button class="chip" type="button" data-id="warm" data-kind="color">
              <span class="chip__glyph" aria-hidden="true"></span>
              <span class="chip__label">Warm</span>
              <span class="chip__sub">夜燈</span>
            </button>
            <button class="chip" type="button" data-id="off" data-kind="off">
              <span class="chip__glyph" aria-hidden="true"></span>
              <span class="chip__label">Off</span>
              <span class="chip__sub">關閉</span>
            </button>
          </div>
        </section>

        <!-- Apply CTA -->
        <button id="apply" class="apply" type="button">
          <span class="apply__label">Apply</span>
          <span class="apply__applied" id="apply-applied">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3 9.5l4 4 8-9" stroke="#fff" stroke-width="2.2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Applied
          </span>
        </button>

        <!-- Power row -->
        <div class="power-row">
          <div class="power-row__left">
            <svg class="power-row__icon" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M9 2v7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <path d="M4.5 4.5a6 6 0 109 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <div>
              <div class="power-row__title">Power</div>
              <div id="power-sub" class="power-row__sub">燈泡開啟中</div>
            </div>
          </div>
          <button id="power-toggle" class="toggle-switch" type="button"
                  role="switch" aria-checked="true" aria-label="Power"
                  data-on="true"></button>
        </div>
      </main>

      <!-- ───── Connection state showcase (desktop) ───── -->
      <aside class="states" aria-label="Connection states">
        <div class="states__title">Connection States</div>
        <button class="state-card" type="button" data-state="connected" data-active="true">
          <span class="conn-dot" style="--dot-color:#34C759"></span>
          <div>
            <div class="state-card__label">Connected</div>
            <div class="state-card__sub">綠燈 + 名稱</div>
          </div>
        </button>
        <button class="state-card" type="button" data-state="scanning">
          <span class="conn-dot" style="--dot-color:#9A9A9A"></span>
          <div>
            <div class="state-card__label">Scanning</div>
            <div class="state-card__sub">灰閃,搜尋中</div>
          </div>
        </button>
        <button class="state-card" type="button" data-state="reconnecting">
          <span class="conn-dot" style="--dot-color:#FF9F0A"></span>
          <div>
            <div class="state-card__label">Reconnecting</div>
            <div class="state-card__sub">橘燈,自動重試</div>
          </div>
        </button>
        <button class="state-card" type="button" data-state="failed">
          <span class="conn-dot" style="--dot-color:#FF3B30"></span>
          <div>
            <div class="state-card__label">Failed</div>
            <div class="state-card__sub">紅燈 + tap retry</div>
          </div>
        </button>
      </aside>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
