<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kc_smart_lamp</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #1a1a1a; color: #eee;
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2rem;
  }
  h1 { font-size: 1.4rem; margin: 0; opacity: 0.7; font-weight: 500; letter-spacing: 0.02em; }
  .panel {
    background: #2a2a2a; border-radius: 14px;
    padding: 2rem; width: 100%; max-width: 380px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }
  .row { margin-bottom: 1.5rem; }
  .row:last-of-type { margin-bottom: 0; }
  label.field {
    display: block; font-size: 0.8rem; opacity: 0.7;
    margin-bottom: 0.5rem; letter-spacing: 0.04em; text-transform: uppercase;
  }
  input[type="color"] {
    width: 100%; height: 96px; border: none; border-radius: 10px;
    cursor: pointer; background: transparent; padding: 0;
  }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 8px; background: #444; border-radius: 4px;
    outline: none; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: #eee; cursor: pointer; border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 22px; height: 22px; border-radius: 50%;
    background: #eee; cursor: pointer; border: none;
  }
  .toggle { display: flex; align-items: center; gap: 0.6rem; }
  .toggle input { width: 20px; height: 20px; cursor: pointer; }
  .toggle label { cursor: pointer; user-select: none; }
  button#submit {
    width: 100%; padding: 0.95rem; border: none; border-radius: 10px;
    background: #4a90e2; color: white; font-size: 1rem; font-weight: 600;
    cursor: pointer; letter-spacing: 0.02em;
    transition: background 0.15s;
  }
  button#submit:hover:not(:disabled) { background: #5aa0f2; }
  button#submit:active:not(:disabled) { background: #3a80d2; }
  button#submit:disabled { background: #555; cursor: wait; }
  #status {
    margin-top: 1rem; font-size: 0.85rem; min-height: 1.4em;
    text-align: center; opacity: 0.6; transition: opacity 0.2s;
  }
  #status.ok { color: #6bd86b; opacity: 1; }
  #status.error { color: #ff7575; opacity: 1; }
</style>
</head>
<body>
<h1>kc_smart_lamp</h1>
<div class="panel">
  <div class="row">
    <label class="field" for="color">Color</label>
    <input type="color" id="color" value="#ff5733">
  </div>
  <div class="row">
    <label class="field" for="brightness">Brightness · <span id="brightness-val">50</span>%</label>
    <input type="range" id="brightness" min="0" max="100" value="50">
  </div>
  <div class="row toggle">
    <input type="checkbox" id="power" checked>
    <label for="power">Power on</label>
  </div>
  <button id="submit">Apply</button>
  <div id="status"></div>
</div>
<script>
  const $color = document.getElementById('color');
  const $bright = document.getElementById('brightness');
  const $brightVal = document.getElementById('brightness-val');
  const $power = document.getElementById('power');
  const $submit = document.getElementById('submit');
  const $status = document.getElementById('status');

  $bright.addEventListener('input', () => {
    $brightVal.textContent = $bright.value;
  });

  function hexToRgb(hex) {
    const m = hex.match(/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
    if (!m) return null;
    return { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) };
  }

  async function submit() {
    $submit.disabled = true;
    $status.className = '';
    $status.textContent = 'Applying...';
    const rgb = hexToRgb($color.value);
    if (!rgb) {
      $status.className = 'error';
      $status.textContent = 'invalid color';
      $submit.disabled = false;
      return;
    }
    const body = {
      power: $power.checked,
      r: rgb.r, g: rgb.g, b: rgb.b,
      brightness: parseInt($bright.value, 10),
    };
    try {
      const resp = await fetch('/api/set_state', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!resp.ok) {
        const err = await resp.text();
        throw new Error(`${resp.status}: ${err}`);
      }
      $status.className = 'ok';
      $status.textContent = 'OK';
    } catch (e) {
      $status.className = 'error';
      $status.textContent = `error: ${e.message}`;
    } finally {
      $submit.disabled = false;
    }
  }

  $submit.addEventListener('click', submit);
</script>
</body>
</html>
