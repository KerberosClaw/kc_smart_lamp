[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kc-smart-lamp"
version = "0.1.0"
description = "BLE host CLI + Web for kc_smart_lamp"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Steve Chiang"},
]
dependencies = [
    "bleak>=0.21",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
smart-lamp = "lamp_client.cli:main"
smart-lamp-web = "lamp_client.web:main"

[tool.setuptools]
packages = ["lamp_client"]

[tool.setuptools.package-data]
lamp_client = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
