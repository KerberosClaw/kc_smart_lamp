; PlatformIO project for kc_smart_lamp firmware.
;
; Target board: ESP32-S3-WROOM-1 N16R8 (using esp32-s3-devkitc-1 as the
; closest official board profile — same chip + flash/PSRAM combo).
;
; Build / flash / monitor:
;   pio run                       compile only
;   pio run -t upload             flash (board must be in download mode)
;   pio device monitor            serial console (115200 baud)

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; ESP32-S3 native USB. ARDUINO_USB_MODE=1 routes Serial through
; USB-Serial/JTAG (same endpoint as the bootloader), which is more
; stable for development than USB-OTG.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    -D LAMP_LED_PIN=48

lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    fastled/FastLED@^3.7.0
